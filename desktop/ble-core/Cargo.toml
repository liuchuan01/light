[package]
name = "model-light-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "=0.13.4"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
